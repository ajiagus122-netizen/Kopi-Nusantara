<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambah Menu</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="layout">
<header>Admin Kopi Nusantara</header>
<aside>
<a href="dashboard.html">Dashboard</a>
<a href="pesanan.html">Pesanan</a>
<a href="tambah-menu.html">Tambah Menu</a>
</aside>
<main>
<h2>Tambah Menu</h2>
<form id="formMenu" action="#" method="post" style="background:white; padding:20px; border-radius:8px; border:1px solid #d7c4b3; max-width:500px;">
<div style="margin-bottom:12px;">
<label for="namaMenu">Nama Menu</label><br>
<input type="text" id="namaMenu" name="namaMenu" style="width:100%; padding:8px; border:1px solid #d7c4b3; border-radius:4px;">
<small class="error" id="errNamaMenu" style="margin-left:0;"></small>
</div>
<div style="margin-bottom:12px;">
<label for="kategoriMenu">Kategori</label><br>
<select id="kategoriMenu" name="kategoriMenu" style="width:100%; padding:8px; border:1px solid #d7c4b3; border-radius:4px;">
<option value="">-- Pilih --</option>
<option value="Kopi">Kopi</option>
<option value="Non Kopi">Non Kopi</option>
</select>
<small class="error" id="errKategori" style="margin-left:0;"></small>
</div>
<div style="margin-bottom:12px;">
<label for="hargaMenu">Harga</label><br>
<input type="number" id="hargaMenu" name="hargaMenu" style="width:100%; padding:8px; border:1px solid #d7c4b3; border-radius:4px;">
<small class="error" id="errHarga" style="margin-left:0;"></small>
</div>
<div style="margin-bottom:12px;">
<label for="deskripsi">Deskripsi</label><br>
<textarea id="deskripsi" name="deskripsi" style="width:100%; padding:8px; border:1px solid #d7c4b3; border-radius:4px;"></textarea>
</div>
<button type="submit" style="padding:8px 16px; background:#6f4e37; color:white; border:none; border-radius:4px; cursor:pointer;">Simpan</button>
</form>
<p id="menuSukses" style="color:green; font-weight:bold; margin-top:10px;"></p>
</main>
<footer>&copy; 2026 Kopi Nusantara</footer>
</div>
<script src="../js/app.js"></script>
</body>
</html>
