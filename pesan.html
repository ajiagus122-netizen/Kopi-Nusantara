<main>
<h2>Form Pemesanan</h2>
<form id="formPesan" action="#" method="post">
<label for="nama">Nama</label>
<input type="text" id="nama" name="nama">
<small class="error" id="errNama"></small><br>

<label for="hp">No. HP</label>
<input type="tel" id="hp" name="hp">
<small class="error" id="errHp"></small><br>

<label for="menu">Menu</label>
<select id="menu" name="menu">
<option value="18000">Kopi Wamena - 18000</option>
<option value="20000">Kopi Susu - 20000</option>
<option value="15000">Teh Tarik - 15000</option>
</select><br>

<label for="jumlah">Jumlah</label>
<input type="number" id="jumlah" name="jumlah" min="1" value="1"><br>

<p>Total: <b id="total">Rp18000</b></p>

<label>Penyajian</label>
<input type="radio" name="saji" value="panas" checked> Panas
<input type="radio" name="saji" value="dingin"> Dingin<br>

<label for="catatan">Catatan</label>
<textarea id="catatan" name="catatan"></textarea><br>

<button type="submit">Pesan</button>
</form>
<p id="pesanSukses"></p>
</main>
